# V-Filter skin, Force-Look (0.7.0, as Rattler 1.1 and Fader FX 1.2): large type, big touch targets, a colourful page of its
# own (gradient, glow, light rays, dark panels behind the controls), arc knobs, big option segments and buttons.
# force_look.py (vst.json "skin_post") repaints the generator's images and draws the #@title / #@frame / #@text lines
# (comments for the generator). Coordinates in shadow pixels (x 0-1280, y 86-714). Each page: its name at the top
# left, two framed rows of controls; the Q-Links per page as before. A knob with an odd radius has a bipolar arc
# (from 12 o'clock). Colours: deep indigo with V-Filter's red.
style=plain
font_label=fonts/DejaVuSans-Bold.ttf
label_scale=1.5
scale_names=1
theme_bg=1a2a6a
theme_panel=1a2a6a
theme_box=1a2a6a
theme_ink=ffffff
theme_ink_dim=ffb3c0
theme_accent=ff3b5c
theme_accent_hi=ffffff
theme_lcd=070b24
theme_ink_faint=1a2a6a
#@look bg_top=0a0f2e bg_bottom=1a2a6a glow=5a3bd6 ray1=ff3b5c ray2=3b6bff ray_alpha=38 panel=070b24 frame=ff3b5c frame_text=0a0f2e title=ffffff sub=ffb3c0 text=f0f2ff knob_face=162258 knob_rim=4a5aa8 knob_track=1c2a66 knob_arc=ff3b5c pointer=ffffff slider_track=1c2a66 slider_fill=ff3b5c slider_cap=ffffff slider_cap_line=162258 btn=2a3a8a btn_ring=ff3b5c btn_text=ffffff btn_down=ff3b5c btn_down_text=0a0f2e seg=162258 seg_ring=4a5aa8 seg_text=dde3ff seg_on=ff3b5c seg_on_ring=ffffff seg_on_text=0a0f2e pill_off=162258 pill_on=ff3b5c pill_dot=ffffff list=070b24 list_ring=ff3b5c opt=162258 opt_text=f0f2ff opt_on=ff3b5c opt_on_text=0a0f2e

[tab FILTER]
#@title text="FILTER" sub="V-FILTER 0.7"
#@frame x=20 y=156 w=1240 h=270 title="FILTER"
knob cx=175 cy=240 r=52 label="CUTOFF" key=cutoff
knob cx=485 cy=240 r=52 label="RESONANCE" key=reso
knob cx=795 cy=240 r=51 label="FILTER 2" key=f2
knob cx=1105 cy=240 r=52 label="DRIVE" key=drive
#@frame x=20 y=438 w=1240 h=262 title="CHARACTER"
popup cx=175 cy=522 w=280 h=68 label="" key=sat
#@text cx=175 cy=596 label="SATURATION" size=29
knob cx=485 cy=522 r=52 label="EMPHASIS" key=emph
qlinks "FILTER" = cutoff,reso,f2,drive,sat,emph

