# V-Filter MPC skin layout, three tabs: FILTER (the two filters and the saturation between them),
# ENV (the audio-triggered filter envelope, output warmth, stereo width, level) and VOWEL (the
# vowel/formant filter in front of it all), since 0.3.0 SEQ (the 16-step sequencer on the Force's beat grid)
# and STEPS 1-8 / STEPS 9-16 (per step: the vowel on top, on the Q-Links, the level below), since 0.4.0 NOTES
# (the note lane: on/off, root, scale, length, MIDI channel) and NOTES 1-8 / NOTES 9-16 (per step: the note on
# top, on the Q-Links, the trigger REST / NOTE / ACC / SLIDE / ACC SLD below).
# Since 0.5.0 FLOW: the endless line (on/off, speed of the wave, its height, the corridor's width, drift, density).
# The LFO SHAPE, NOTES and FLOW switches and the RANDOM / RESET / RND NOTES buttons are left off the Q-Links.
# Palette as in mpc-vst-rat: black panel, white print, red accent.
style=td3
theme_bg=111111
theme_panel=111111
theme_line=000000
theme_ink=f2f2f2
theme_ink_dim=a0a0a0
theme_ink_faint=555555
theme_accent=e8302a
theme_accent_hi=ff6a5c
theme_knob_face=262626
theme_knob_ring=000000
theme_bar=e8302a
theme_seg_active=e8302a
theme_seg_inactive=262626
theme_seg_active_tx=111111
theme_btn_text=111111
theme_well=000000
theme_knob_off=444444
theme_tab_on=e8302a
theme_tab_on_tx=111111
theme_lcd=140404
theme_box=0a0a0a
theme_btn_bg=f2f2f2
theme_chrome_ink=f2f2f2
theme_go_on=e8302a
theme_go_off=ff6b4a
theme_tabs=e8302a

[tab FILTER]
frame x=36 y=88 w=1207 h=624 title="V-FILTER"
knob cx=250 cy=260 r=34 label="CUTOFF" key=cutoff
knob cx=640 cy=260 r=34 label="RESONANCE" key=reso
knob cx=1030 cy=260 r=34 label="FILTER 2" key=f2
knob cx=250 cy=550 r=34 label="DRIVE" key=drive
popup cx=640 cy=540 w=220 h=48 label="SATURATION" key=sat
knob cx=1030 cy=550 r=34 label="EMPHASIS" key=emph
qlinks "FILTER" = cutoff,reso,f2,drive,sat,emph

