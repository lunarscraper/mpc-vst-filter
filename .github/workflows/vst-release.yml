name: VST release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.5.0
        required: true
        default: 0.5.0
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: true

jobs:
  vfilter:
    uses: open-mpc/mpc-vst-plugins/.github/workflows/vst-release.yml@8e266cec8abd3d780e331404209c3e8b8f699c5c
    permissions:
      contents: write
    with:
      tag: vfilter-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 8e266cec8abd3d780e331404209c3e8b8f699c5c
      vst_dir: vst
      build: bash vst/build.sh
      host_test: bash vst/test.sh
      plugin_id: vfilter
      license: MIT
      about: V-Filter (insert effect) - vowel/formant filter (A-E-I-O-U with envelope and LFO), two serial low-pass filters with saturation in between, audio-triggered filter envelope, output warmth and stereo chorus; a 16-step vowel / level / note sequencer on the Force's beat grid (1/4 to 1/64) that also plays a synth track through its own MIDI port, and FLOW, an endless line swinging in a corridor.
      dry_run: ${{ inputs.dry_run }}
