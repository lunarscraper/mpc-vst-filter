# V-Filter MPC skin layout, three tabs: FILTER (the two filters and the saturation between them),
# ENV (the audio-triggered filter envelope, output warmth, stereo width, level) and VOWEL (the
# vowel/formant filter in front of it all), since 0.3.0 SEQ (the 16-step sequencer on the Force's beat grid)
# and STEPS 1-8 / STEPS 9-16 (per step: the vowel on top, on the Q-Links, the level below).
# The LFO SHAPE switch and the RANDOM / RESET buttons are left off the Q-Links.
# Palette as in mpc-vst-rat: black panel, white print, red accent.
style=td3
theme_bg=111111
theme_panel=111111
theme_line=000000
theme_ink=f2f2f2
theme_ink_dim=a0a0a0
theme_ink_faint=555555
theme_accent=e8302a
theme_accent_hi=ff6a5c
theme_knob_face=262626
theme_knob_ring=000000
theme_bar=e8302a
theme_seg_active=e8302a
theme_seg_inactive=262626
theme_seg_active_tx=111111
theme_btn_text=111111
theme_well=000000
theme_knob_off=444444
theme_tab_on=e8302a
theme_tab_on_tx=111111
theme_lcd=140404
theme_box=0a0a0a
theme_btn_bg=f2f2f2
theme_chrome_ink=f2f2f2
theme_go_on=e8302a
theme_go_off=ff6b4a
theme_tabs=e8302a

[tab FILTER]
frame x=36 y=88 w=1207 h=624 title="V-FILTER"
knob cx=250 cy=260 r=34 label="CUTOFF" key=cutoff
knob cx=640 cy=260 r=34 label="RESONANCE" key=reso
knob cx=1030 cy=260 r=34 label="FILTER 2" key=f2
knob cx=250 cy=550 r=34 label="DRIVE" key=drive
popup cx=640 cy=540 w=220 h=48 label="SATURATION" key=sat
knob cx=1030 cy=550 r=34 label="EMPHASIS" key=emph
qlinks "FILTER" = cutoff,reso,f2,drive,sat,emph

[tab ENV]
frame x=36 y=88 w=1207 h=624 title="ENVELOPE / OUTPUT"
knob cx=250 cy=260 r=34 label="ENV AMOUNT" key=envamt
knob cx=510 cy=260 r=34 label="ATTACK" key=attack
knob cx=770 cy=260 r=34 label="DECAY" key=decay
knob cx=1030 cy=260 r=34 label="THRESHOLD" key=thresh
knob cx=250 cy=550 r=34 label="WARMTH" key=warmth
knob cx=640 cy=550 r=34 label="WIDTH" key=width
knob cx=1030 cy=550 r=34 label="OUTPUT" key=output
qlinks "ENV" = envamt,attack,decay,thresh,warmth,width,output

[tab VOWEL]
frame x=36 y=88 w=1207 h=624 title="VOWEL / FORMANT"
knob cx=250 cy=260 r=34 label="VOWEL" key=vowel
knob cx=510 cy=260 r=34 label="FORMANT" key=formant
knob cx=770 cy=260 r=34 label="FOCUS" key=focus
knob cx=1030 cy=260 r=34 label="VOWEL MIX" key=vmix
knob cx=250 cy=550 r=34 label="VOWEL ENV" key=venv
knob cx=510 cy=550 r=34 label="LFO RATE" key=lforate
knob cx=770 cy=550 r=34 label="LFO DEPTH" key=lfodepth
popup cx=1030 cy=540 w=220 h=48 label="LFO SHAPE" key=lfoshape
qlinks "VOWEL" = vowel,formant,focus,vmix,venv,lforate,lfodepth

[tab SEQ]
frame x=36 y=88 w=1207 h=624 title="STEP SEQUENCER"
popup cx=250 cy=250 w=220 h=48 label="RATE" key=seqrate cols=2
knob cx=510 cy=260 r=34 label="STEPS" key=seqlen
knob cx=770 cy=260 r=34 label="SEQ VOWEL" key=seqdepth
knob cx=1030 cy=260 r=34 label="SEQ GATE" key=seqgate
knob cx=250 cy=550 r=34 label="SEQ FILTER" key=seqcut
knob cx=510 cy=550 r=34 label="GLIDE" key=seqglide
knob cx=770 cy=550 r=34 label="VOWEL MIX" key=vmix
button cx=1030 cy=500 w=230 h=60 label="RANDOM" key=seqrnd
button cx=1030 cy=600 w=230 h=60 label="RESET" key=seqinit
qlinks "SEQ" = seqrate,seqlen,seqdepth,seqgate,seqcut,seqglide,vmix

[tab STEPS 1-8]
frame x=36 y=88 w=1207 h=624 title="STEPS 1-8: VOWEL / LEVEL"
knob cx=115 cy=300 r=40 label="VOWEL 1" key=sv1 bw=140
knob cx=265 cy=300 r=40 label="VOWEL 2" key=sv2 bw=140
knob cx=415 cy=300 r=40 label="VOWEL 3" key=sv3 bw=140
knob cx=565 cy=300 r=40 label="VOWEL 4" key=sv4 bw=140
knob cx=715 cy=300 r=40 label="VOWEL 5" key=sv5 bw=140
knob cx=865 cy=300 r=40 label="VOWEL 6" key=sv6 bw=140
knob cx=1015 cy=300 r=40 label="VOWEL 7" key=sv7 bw=140
knob cx=1165 cy=300 r=40 label="VOWEL 8" key=sv8 bw=140
knob cx=115 cy=560 r=40 label="LEVEL 1" key=sl1 bw=140
knob cx=265 cy=560 r=40 label="LEVEL 2" key=sl2 bw=140
knob cx=415 cy=560 r=40 label="LEVEL 3" key=sl3 bw=140
knob cx=565 cy=560 r=40 label="LEVEL 4" key=sl4 bw=140
knob cx=715 cy=560 r=40 label="LEVEL 5" key=sl5 bw=140
knob cx=865 cy=560 r=40 label="LEVEL 6" key=sl6 bw=140
knob cx=1015 cy=560 r=40 label="LEVEL 7" key=sl7 bw=140
knob cx=1165 cy=560 r=40 label="LEVEL 8" key=sl8 bw=140
qlinks "STEPS 1-8" = sv1,sv2,sv3,sv4,sv5,sv6,sv7,sv8

[tab STEPS 9-16]
frame x=36 y=88 w=1207 h=624 title="STEPS 9-16: VOWEL / LEVEL"
knob cx=115 cy=300 r=40 label="VOWEL 9" key=sv9 bw=140
knob cx=265 cy=300 r=40 label="VOWEL 10" key=sv10 bw=140
knob cx=415 cy=300 r=40 label="VOWEL 11" key=sv11 bw=140
knob cx=565 cy=300 r=40 label="VOWEL 12" key=sv12 bw=140
knob cx=715 cy=300 r=40 label="VOWEL 13" key=sv13 bw=140
knob cx=865 cy=300 r=40 label="VOWEL 14" key=sv14 bw=140
knob cx=1015 cy=300 r=40 label="VOWEL 15" key=sv15 bw=140
knob cx=1165 cy=300 r=40 label="VOWEL 16" key=sv16 bw=140
knob cx=115 cy=560 r=40 label="LEVEL 9" key=sl9 bw=140
knob cx=265 cy=560 r=40 label="LEVEL 10" key=sl10 bw=140
knob cx=415 cy=560 r=40 label="LEVEL 11" key=sl11 bw=140
knob cx=565 cy=560 r=40 label="LEVEL 12" key=sl12 bw=140
knob cx=715 cy=560 r=40 label="LEVEL 13" key=sl13 bw=140
knob cx=865 cy=560 r=40 label="LEVEL 14" key=sl14 bw=140
knob cx=1015 cy=560 r=40 label="LEVEL 15" key=sl15 bw=140
knob cx=1165 cy=560 r=40 label="LEVEL 16" key=sl16 bw=140
qlinks "STEPS 9-16" = sv9,sv10,sv11,sv12,sv13,sv14,sv15,sv16
